services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: pahadi-haat-backend
    runtime: docker
    dockerfilePath: ./pahadi-haat-backend/Dockerfile
    dockerContext: ./pahadi-haat-backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: pahadihaat-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: pahadihaat-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pahadihaat-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Frontend Static Site
  - type: web
    name: pahadi-haat-frontend
    runtime: static
    rootDir: pahadi-haat-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pahadi-haat-backend
          property: host
          value: https://${host}/api

databases:
  # PostgreSQL Database
  - name: pahadihaat-db
    databaseName: pahadihaat
    user: pahadiuser
    plan: free
