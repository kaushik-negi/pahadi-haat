spring.application.name=pahadi-haat-backend

# --- Database (H2, file-based so data survives restarts) ---
# Swap these 4 lines for MySQL/Postgres in production, e.g.:
# spring.datasource.url=jdbc:mysql://localhost:3306/pahadi_haat
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:h2:file:./data/pahadihaat;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 web console at /h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# --- JWT ---
# IMPORTANT: change this secret before deploying to production.
app.jwt.secret=pahadi-haat-super-secret-signing-key-change-me-please-2026
app.jwt.expiration-ms=86400000

# --- CORS ---
# Comma separated list of origins allowed to call this API (the Vite dev server by default)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
